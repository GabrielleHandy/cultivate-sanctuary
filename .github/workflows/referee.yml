name: Referee

on:
  push:
  pull_request:

jobs:
  referee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2.7" fastapi pytest
      - name: progress.json must match the lab tests
        run: python tools/referee.py --check
